<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DMV Design and Build — Project Portal</title>
<link rel="icon" href="logo.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="DMV Portal" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" id="themeColor" content="#0a1628" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'" />
<link rel="stylesheet" href="style.css" />
<script>if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');</script>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap hidden">
  <div class="login-card">
    <img src="logo.png" alt="DMV Design and Build" class="login-logo" />
    <h2>Project Portal</h2>
    <form id="loginForm">
      <input type="text" id="loginUser" placeholder="Username" autocomplete="username" required />
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" class="btn gold w100">Sign In</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>

<!-- APP SHELL -->
<div id="appView" class="app hidden">
  <header class="topbar">
    <button id="menuBtn" class="menu-btn" aria-label="Open menu">☰</button>
    <img src="logo.png" alt="DMV Design and Build" class="top-logo logo-light" />
    <img src="logo-dark.png" alt="DMV Design and Build" class="top-logo logo-dark" />
    <span class="top-spacer"></span>
  </header>
  <div id="navBack" class="nav-back"></div>
  <aside class="sidebar" id="sidebar">
    <img src="logo.png" alt="DMV" class="side-logo logo-light" />
    <img src="logo-dark.png" alt="DMV" class="side-logo logo-dark" />
    <nav id="navLinks"></nav>
    <div class="side-bottom">
      <div id="whoami" class="whoami"></div>
      <button id="pwBtn" class="btn ghost w100" style="margin-bottom:8px">Change Password</button>
      <button id="themeBtn" class="btn ghost w100" style="margin-bottom:8px"></button>
      <button id="logoutBtn" class="btn ghost w100">Log out</button>
    </div>
  </aside>
  <main id="main" class="main"></main>
</div>

<!-- FULLSCREEN MAP -->
<div id="mapFull" class="map-full hidden">
  <button id="mapCloseBtn" class="btn gold map-close">✕ Close Map</button>
  <div id="bigmap"></div>
</div>

<!-- MODAL -->
<div id="modal" class="modal-back hidden">
  <div class="modal-card" id="modalCard"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>if (typeof L === 'undefined') document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');</script>
<script src="app.js"></script>
</body>
</html>
